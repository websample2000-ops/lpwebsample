linkList:
  title: "リンクリスト"
  headerRow: 1
  dataStartRow: 2
  columns:
    id:
      type: number
      description: "管理用番号"
      required: true

    title:
      type: string
      description: "リンクタイトル"
      required: true

    buttonImage:
      type: image
      description: "リンクボタンに表示する画像（未入力の場合デフォルト画像）"
      source_type:
        enum:
          upload: "アップロード"
          select: "画像選択"
        default: "upload"
      mediaLibrary: "asset/link"
      uploadPath: "asset/link"
      default: "asset/link/defaultbutton.png"
      required: false

    link:
      type: url
      description: "リンクのURL"
      required: true

    priority:
      type: number
      description: "表示優先度"
      min: 1
      required: true